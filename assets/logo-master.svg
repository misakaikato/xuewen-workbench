<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>学问 Workbench</title>
  <!-- 现代 mark：朱砂圆角方块 + 几何「门」形与中心方点（学问 = 门中有问） -->
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#b23a24"/>
  </g>
  <!-- 门形：平头端点，外角大圆角，壁厚 100 -->
  <path fill="#f7f1e3" d="
    M 268 736
    L 268 416
    Q 268 296 388 296
    L 636 296
    Q 756 296 756 416
    L 756 736
    L 656 736
    L 656 452
    Q 656 396 600 396
    L 424 396
    Q 368 396 368 452
    L 368 736
    Z"/>
  <!-- 中心方点 -->
  <rect x="433" y="487" width="158" height="158" rx="38" fill="#f7f1e3"/>
</svg>
