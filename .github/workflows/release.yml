# 发布流水线：打 tag 触发 mac + win 并行构建，产物上传为 draft release；
# 两个平台都构建成功后 finalize 自动发布（draft → published + latest）。
# draft 的意义是「资源没传完时客户端看不到」——finalize 只在 build 全绿时才跑。
# 注意：package.json 里 build.publish 的 owner/repo 必须是真实仓库
#
# draft 竞态的根治：electron-builder 每个发布目标（mac 的 zip/dmg、win 的 nsis）各持一套
# 发布器，各自「查不到就建」——并行矩阵、甚至单 job 内双目标都会各建一个 draft。
# prepare 先行预建唯一 draft，所有发布器 getOrCreateRelease 都能命中复用；
# finalize 兜底删除带空格的历史命名差异资产。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 允许 GITHUB_TOKEN 创建 release 并上传资产

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes 需要 git 仓库与 tag 历史，否则报
      # "not a git repository"；fetch-depth: 0 才拿得到完整历史用于生成说明
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 预建 draft release（幂等：已存在则跳过）
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: release:mac
          - os: windows-latest
            script: release:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 清理带空格的重复资产（mac 双发布器命名差异遗留）
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | select(.name | test(" ")) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id"
                echo "deleted stray asset: $id"
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 两个平台都构建成功才走到这里：发布 draft 并标为 latest。
      # 不发布的话客户端永远查不到新版本（electron-updater 只认已发布 release）。
      - name: 发布 release（draft → published，设为 latest）
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
